<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - FPS</title>
    <style>
      body {
        background-color: rgb(200, 200, 200);
        margin: 0px;
        overflow: hidden;
      }

      #info {
        position: absolute;
        top: 0px;
        width: 100%;
        color: #ffffff;
        padding: 5px;
        font-family: Monospace;
        font-size: 13px;
        font-weight: bold;
        text-align: center;
      }

      a {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="info">
      <a href="http://threejs.org" target="_blank" rel="noopener">three.js</a> -
      platformer demo. cubemap by
      <a href="http://www.zfight.com/" target="_blank" rel="noopener"
        >Jochum Skoglund</a
      >.<br />Click to look around with the mouse, WASD to move, SHIFT to run
      and SPACE to jump.
    </div>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";

      // player motion parameters

      const motion = {
        airborne: false,
        position: new THREE.Vector3(),
        velocity: new THREE.Vector3(),
        rotation: new THREE.Vector2(),
      };

      motion.position.y = -150;

      // game systems code

      const resetPlayer = function () {
        if (motion.position.y < -123) {
          motion.position.set(-2, 7.7, 25);
          motion.velocity.multiplyScalar(0);
        }
      };

      const keyboardControls = (function () {
        const keys = {
          SP: "Space",
          W: "KeyW",
          A: "KeyA",
          S: "KeyS",
          D: "KeyD",
          SH: "ShiftLeft",
        };

        const keysPressed = {};

        (function (watchedKeyCodes) {
          const handler = function (down) {
            return function (e) {
              const index = watchedKeyCodes.indexOf(e.code);
              if (index >= 0) {
                keysPressed[watchedKeyCodes[index]] = down;
                e.preventDefault();
              }
            };
          };
          window.addEventListener("keydown", handler(true));
          window.addEventListener("keyup", handler(false));
        })([keys.SP, keys.W, keys.A, keys.S, keys.D, keys.SH]);

        const forward = new THREE.Vector3();
        const sideways = new THREE.Vector3();

        return function () {
          if (!motion.airborne) {
            // move around
            forward.set(
              Math.sin(motion.rotation.y),
              0,
              Math.cos(motion.rotation.y),
            );
            sideways.set(forward.z, 0, -forward.x);

            const speed = keysPressed[keys.SH] ? 0.2 : 0.1;
            forward.multiplyScalar(
              keysPressed[keys.W] ? -speed : keysPressed[keys.S] ? speed : 0,
            );
            sideways.multiplyScalar(
              keysPressed[keys.A] ? -speed : keysPressed[keys.D] ? speed : 0,
            );

            const combined = forward.add(sideways);
            if (Math.abs(combined.x) >= Math.abs(motion.velocity.x))
              motion.velocity.x = combined.x;
            if (Math.abs(combined.y) >= Math.abs(motion.velocity.y))
              motion.velocity.y = combined.y;
            if (Math.abs(combined.z) >= Math.abs(motion.velocity.z))
              motion.velocity.z = combined.z;

            //jump
            const vy = keysPressed[keys.SP] ? 0.7 : 0;
            motion.velocity.y += vy;
          }
        };
      })();

      (function () {
        const element = document.getElementById("container");
        const sensitivity = 0.002;

        element.addEventListener("click", function () {
          element.requestPointerLock();
        });

        document.addEventListener("mousemove", function (e) {
          if (document.pointerLockElement !== element) return;

          motion.rotation.y -= e.movementX * sensitivity;
          motion.rotation.x -= e.movementY * sensitivity;
          motion.rotation.x = Math.max(-1.2, Math.min(1.2, motion.rotation.x));
        });
      })();

      const jumpPads = (function () {
        const pads = [
          new THREE.Vector3(-17.5, 8, -10),
          new THREE.Vector3(17.5, 8, -10),
          new THREE.Vector3(0, 8, 21),
        ];
        const temp = new THREE.Vector3();

        return function () {
          if (!motion.airborne) {
            for (let j = 0, n = pads.length; j < n; j++) {
              if (pads[j].distanceToSquared(motion.position) < 2.3) {
                // calculate velocity towards another side of platform from jump pad position
                temp.copy(pads[j]);
                temp.y = 0;
                temp.setLength(-0.8);
                temp.y = 0.7;

                motion.airborne = true;
                motion.velocity.copy(temp);
                break;
              }
            }
          }
        };
      })();

      const applyPhysics = (function () {
        const timeStep = 5;
        let timeLeft = timeStep + 1;

        const birdsEye = 100;
        const kneeDeep = 0.4;

        const raycaster = new THREE.Raycaster();
        raycaster.ray.direction.set(0, -1, 0);

        const displacement = new THREE.Vector3();

        return function (dt) {
          const platform = scene.getObjectByName("platform", true);
          if (platform) {
            timeLeft += dt;

            // run several fixed-step iterations to approximate varying-step

            dt = 5;
            while (timeLeft >= dt) {
              const time = 0.3,
                damping = 0.93,
                gravity = 0.01,
                tau = 2 * Math.PI;

              raycaster.ray.origin.copy(motion.position);
              raycaster.ray.origin.y += birdsEye;

              const hits = raycaster.intersectObject(platform);

              motion.airborne = true;

              // are we above, or at most knee deep in, the platform?

              if (hits.length > 0 && hits[0].face.normal.y > 0) {
                const actualHeight = hits[0].distance - birdsEye;

                // collision: stick to the surface if landing on it

                if (
                  motion.velocity.y <= 0 &&
                  Math.abs(actualHeight) < kneeDeep
                ) {
                  motion.position.y -= actualHeight;
                  motion.velocity.y = 0;
                  motion.airborne = false;
                }
              }

              if (motion.airborne) motion.velocity.y -= gravity;

              displacement.copy(motion.velocity).multiplyScalar(time);
              if (!motion.airborne) motion.velocity.multiplyScalar(damping);

              motion.position.add(displacement);

              // wrap horizontal rotation to 0...2π

              motion.rotation.y += tau;
              motion.rotation.y %= tau;

              timeLeft -= dt;
            }
          }
        };
      })();

      const updateCamera = (function () {
        const euler = new THREE.Euler(0, 0, 0, "YXZ");

        return function () {
          euler.x = motion.rotation.x;
          euler.y = motion.rotation.y;
          camera.quaternion.setFromEuler(euler);

          camera.position.copy(motion.position);

          camera.position.y += 3.0;

          skybox.position.copy(camera.position);
        };
      })();

      // init 3D stuff

      function makeSkybox(urls, size) {
        const materials = [];

        for (let i = 0; i < urls.length; i++) {
          materials.push(
            new THREE.MeshBasicMaterial({
              map: new THREE.TextureLoader().load(urls[i]),
            }),
          );
        }

        const geometry = new THREE.BoxGeometry(size, size, size, 1, 1, 1);
        geometry.scale(-1, 1, 1);
        return new THREE.Mesh(geometry, materials);
      }

      function makePlatform(jsonUrl, textureUrl) {
        const placeholder = new THREE.Object3D();

        const texture = new THREE.TextureLoader().load(textureUrl);
        texture.minFilter = THREE.LinearFilter;

        const loader = new THREE.BufferGeometryLoader();
        loader.load(jsonUrl, function (geometry) {
          const platform = new THREE.Mesh(
            geometry,
            new THREE.MeshBasicMaterial({ map: texture }),
          );

          platform.name = "platform";

          placeholder.add(platform);
        });

        return placeholder;
      }

      const renderer = new C3RRenderer();

      const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 9000);

      const scene = new THREE.Scene();

      scene.add(camera);

      const skybox = makeSkybox(
        [
          "textures/cube/skybox/px.jpg", // right
          "textures/cube/skybox/nx.jpg", // left
          "textures/cube/skybox/py.jpg", // top
          "textures/cube/skybox/ny.jpg", // bottom
          "textures/cube/skybox/pz.jpg", // back
          "textures/cube/skybox/nz.jpg", // front
        ],
        2000,
      );

      scene.add(skybox);

      scene.add(
        makePlatform(
          "models/platform/platform.json",
          "models/platform/platform.jpg",
        ),
      );

      // start the game

      const start = function (gameLoop, gameViewportSize) {
        const resize = function () {
          const viewport = gameViewportSize();
          renderer.setSize(viewport.width, viewport.height);
          camera.aspect = viewport.width / viewport.height;
          camera.updateProjectionMatrix();
        };

        window.addEventListener("resize", resize);
        resize();

        let lastTimeStamp;
        const render = function (timeStamp) {
          const timeElapsed = lastTimeStamp ? timeStamp - lastTimeStamp : 0;
          lastTimeStamp = timeStamp;

          // call our game loop with the time elapsed since last rendering, in ms
          gameLoop(timeElapsed);

          renderer.render(scene, camera);
          requestAnimationFrame(render);
        };

        requestAnimationFrame(render);

        if (navigator.userAgent.toLowerCase().indexOf("firefox") > -1) {
          // The scene is not rendered in Firefox, without an initial move
          setTimeout(function () {
            motion.velocity.y = 0.5;
          }, 1500);
        }
      };

      const gameLoop = function (dt) {
        resetPlayer();
        keyboardControls();
        jumpPads();
        applyPhysics(dt);
        updateCamera();
      };

      const gameViewportSize = function () {
        return {
          width: window.innerWidth,
          height: window.innerHeight,
        };
      };

      document.getElementById("container").appendChild(renderer.domElement);

      start(gameLoop, gameViewportSize);
    </script>
  </body>
</html>
