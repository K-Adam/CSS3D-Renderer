<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - FPS</title>
    <style>
      body {
        margin: 0;
        background-color: rgb(200, 200, 200);
        overflow: hidden;
        touch-action: none;
      }

      #info {
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        color: #fff;
        font: 13px monospace;
        text-align: center;
      }

      a {
        color: #ffffff;
      }

      #joystick {
        position: absolute;
        z-index: 1;
        left: 0;
        bottom: 0;
        width: 160px;
        height: 160px;
      }

      #jump {
        position: absolute;
        z-index: 1;
        right: 30px;
        bottom: 30px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }

      #jump::after {
        content: "";
        position: absolute;
        inset: 25px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transform: translate(var(--x, 0), var(--y, 0));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
      - platformer. Cubemap by
      <a href="http://www.zfight.com/" target="_blank" rel="noopener"
        >Jochum Skoglund</a
      >.<br />Click to look around with the mouse, WASD to move, SHIFT to run
      and SPACE to jump.<br />On touch: left stick to move, drag to look, tap
      the right stick to jump.
    </div>
    <div id="joystick"></div>
    <div id="jump"></div>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";
      import Stats from "three/addons/libs/stats.module.js";
      import nipplejs from "nipplejs";

      // player motion parameters

      const motion = {
        airborne: false,
        position: new THREE.Vector3(),
        velocity: new THREE.Vector3(),
        rotation: new THREE.Vector2(),
      };

      motion.position.y = -150;

      // game systems code

      const resetPlayer = function () {
        if (motion.position.y < -123) {
          motion.position.set(-2, 7.7, 25);
          motion.velocity.multiplyScalar(0);
        }
      };

      const keys = {
        SP: "Space",
        W: "KeyW",
        A: "KeyA",
        S: "KeyS",
        D: "KeyD",
        SH: "ShiftLeft",
      };

      const keysPressed = {};

      // Right stick deflection in -1..1, turns the view while held
      const look = new THREE.Vector2();

      const turn = function (dx, dy) {
        motion.rotation.y -= dx;
        motion.rotation.x = THREE.MathUtils.clamp(
          motion.rotation.x - dy,
          -1.2,
          1.2,
        );
      };

      const keyboardControls = (function () {
        (function (watchedKeyCodes) {
          const handler = function (down) {
            return function (e) {
              const index = watchedKeyCodes.indexOf(e.code);
              if (index >= 0) {
                keysPressed[watchedKeyCodes[index]] = down;
                e.preventDefault();
              }
            };
          };
          window.addEventListener("keydown", handler(true));
          window.addEventListener("keyup", handler(false));
        })([keys.SP, keys.W, keys.A, keys.S, keys.D, keys.SH]);

        const forward = new THREE.Vector3();
        const sideways = new THREE.Vector3();

        return function () {
          if (!motion.airborne) {
            // move around
            forward.set(
              Math.sin(motion.rotation.y),
              0,
              Math.cos(motion.rotation.y),
            );
            sideways.set(forward.z, 0, -forward.x);

            const speed = keysPressed[keys.SH] ? 0.2 : 0.1;
            forward.multiplyScalar(
              keysPressed[keys.W] ? -speed : keysPressed[keys.S] ? speed : 0,
            );
            sideways.multiplyScalar(
              keysPressed[keys.A] ? -speed : keysPressed[keys.D] ? speed : 0,
            );

            const combined = forward.add(sideways);
            if (Math.abs(combined.x) >= Math.abs(motion.velocity.x))
              motion.velocity.x = combined.x;
            if (Math.abs(combined.y) >= Math.abs(motion.velocity.y))
              motion.velocity.y = combined.y;
            if (Math.abs(combined.z) >= Math.abs(motion.velocity.z))
              motion.velocity.z = combined.z;

            //jump
            const vy = keysPressed[keys.SP] ? 0.7 : 0;
            motion.velocity.y += vy;
          }
        };
      })();

      (function () {
        const sensitivity = 0.002;

        document.addEventListener("click", function (e) {
          if (
            e.pointerType !== "touch" &&
            renderer.domElement.contains(e.target)
          )
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener("mousemove", function (e) {
          if (document.pointerLockElement !== renderer.domElement) return;

          turn(e.movementX * sensitivity, e.movementY * sensitivity);
        });
      })();

      (function () {
        const zone = document.getElementById("joystick");
        const jump = document.getElementById("jump");
        if (!matchMedia("(pointer: coarse)").matches) {
          zone.remove();
          jump.remove();
          return;
        }

        const setMove = function (x, y, force) {
          keysPressed[keys.W] = y > 0.3;
          keysPressed[keys.S] = y < -0.3;
          keysPressed[keys.A] = x < -0.3;
          keysPressed[keys.D] = x > 0.3;
          keysPressed[keys.SH] = force > 0.9;
        };

        const joystick = nipplejs.create({
          zone: zone,
          mode: "static",
          position: { left: "50%", top: "50%" },
          color: { front: "white", back: "rgba(255, 255, 255, 0.5)" },
        });
        joystick.on("move", function (e) {
          setMove(e.data.vector.x, e.data.vector.y, e.data.force);
        });
        joystick.on("end", function () {
          setMove(0, 0, 0);
        });

        const sensitivity = 0.005;
        const knobRadius = 25;
        const touches = {};

        document.addEventListener("pointerdown", function (e) {
          if (e.pointerType !== "touch" || zone.contains(e.target)) return;
          touches[e.pointerId] = {
            x: e.clientX,
            y: e.clientY,
            startX: e.clientX,
            startY: e.clientY,
            knob: e.target === jump,
            moved: false,
          };
        });

        const moveKnob = function (dx, dy) {
          const scale = Math.min(1, knobRadius / (Math.hypot(dx, dy) || 1));
          jump.style.setProperty("--x", dx * scale + "px");
          jump.style.setProperty("--y", dy * scale + "px");
          look.set(dx, dy).multiplyScalar(scale / knobRadius);
        };

        document.addEventListener("pointermove", function (e) {
          const t = touches[e.pointerId];
          if (!t) return;
          const [dx, dy] = [e.clientX - t.startX, e.clientY - t.startY];
          if (Math.hypot(dx, dy) > 10) t.moved = true;
          if (t.knob) return moveKnob(dx, dy);
          turn(
            (e.clientX - t.x) * sensitivity,
            (e.clientY - t.y) * sensitivity,
          );
          t.x = e.clientX;
          t.y = e.clientY;
        });

        const end = function (e) {
          const t = touches[e.pointerId];
          delete touches[e.pointerId];
          if (!t?.knob) return;
          moveKnob(0, 0);
          if (!t.moved && e.type === "pointerup") {
            keysPressed[keys.SP] = true;
            setTimeout(() => (keysPressed[keys.SP] = false), 100);
          }
        };
        document.addEventListener("pointerup", end);
        document.addEventListener("pointercancel", end);
      })();

      const jumpPads = (function () {
        const pads = [
          new THREE.Vector3(-17.5, 8, -10),
          new THREE.Vector3(17.5, 8, -10),
          new THREE.Vector3(0, 8, 21),
        ];
        const temp = new THREE.Vector3();

        return function () {
          if (!motion.airborne) {
            for (let j = 0, n = pads.length; j < n; j++) {
              if (pads[j].distanceToSquared(motion.position) < 2.3) {
                // calculate velocity towards another side of platform from jump pad position
                temp.copy(pads[j]);
                temp.y = 0;
                temp.setLength(-0.8);
                temp.y = 0.7;

                motion.airborne = true;
                motion.velocity.copy(temp);
                break;
              }
            }
          }
        };
      })();

      const applyPhysics = (function () {
        const timeStep = 5;
        let timeLeft = timeStep + 1;

        const birdsEye = 100;
        const kneeDeep = 0.4;

        const raycaster = new THREE.Raycaster();
        raycaster.ray.direction.set(0, -1, 0);

        const displacement = new THREE.Vector3();

        return function (dt) {
          const platform = scene.getObjectByName("platform", true);
          if (platform) {
            timeLeft += dt;

            // run several fixed-step iterations to approximate varying-step

            dt = 5;
            while (timeLeft >= dt) {
              const time = 0.3,
                damping = 0.93,
                gravity = 0.01,
                tau = 2 * Math.PI;

              raycaster.ray.origin.copy(motion.position);
              raycaster.ray.origin.y += birdsEye;

              const hits = raycaster.intersectObject(platform);

              motion.airborne = true;

              // are we above, or at most knee deep in, the platform?

              if (hits.length > 0 && hits[0].face.normal.y > 0) {
                const actualHeight = hits[0].distance - birdsEye;

                // collision: stick to the surface if landing on it

                if (
                  motion.velocity.y <= 0 &&
                  Math.abs(actualHeight) < kneeDeep
                ) {
                  motion.position.y -= actualHeight;
                  motion.velocity.y = 0;
                  motion.airborne = false;
                }
              }

              if (motion.airborne) motion.velocity.y -= gravity;

              displacement.copy(motion.velocity).multiplyScalar(time);
              if (!motion.airborne) motion.velocity.multiplyScalar(damping);

              motion.position.add(displacement);

              // wrap horizontal rotation to 0...2π

              motion.rotation.y += tau;
              motion.rotation.y %= tau;

              timeLeft -= dt;
            }
          }
        };
      })();

      const updateCamera = (function () {
        const euler = new THREE.Euler(0, 0, 0, "YXZ");

        return function () {
          euler.x = motion.rotation.x;
          euler.y = motion.rotation.y;
          camera.quaternion.setFromEuler(euler);

          camera.position.copy(motion.position);

          camera.position.y += 3.0;

          skybox.position.copy(camera.position);
        };
      })();

      // init 3D stuff

      function makeSkybox(urls, size) {
        const materials = [];

        for (let i = 0; i < urls.length; i++) {
          materials.push(
            new THREE.MeshBasicMaterial({
              map: new THREE.TextureLoader().load(urls[i]),
            }),
          );
        }

        const geometry = new THREE.BoxGeometry(size, size, size, 1, 1, 1);
        geometry.scale(-1, 1, 1);
        return new THREE.Mesh(geometry, materials);
      }

      function makePlatform(jsonUrl, textureUrl, plateUrl) {
        const placeholder = new THREE.Object3D();

        const texture = new THREE.TextureLoader().load(textureUrl);
        texture.minFilter = THREE.LinearFilter;

        // The diamond plate tiles in world space, so neighbouring faces line up
        const plate = new THREE.TextureLoader().load(plateUrl);
        plate.wrapS = plate.wrapT = THREE.RepeatWrapping;

        const loader = new THREE.BufferGeometryLoader();
        loader.load(jsonUrl, function (geometry) {
          const platform = new THREE.Mesh(geometry, [
            new THREE.MeshBasicMaterial({ map: texture }),
            new THREE.MeshBasicMaterial({ map: plate }),
          ]);

          platform.name = "platform";

          placeholder.add(platform);
        });

        return placeholder;
      }

      const renderer = new C3RRenderer();

      const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 9000);

      const scene = new THREE.Scene();

      scene.add(camera);

      const skybox = makeSkybox(
        [
          "textures/cube/skybox/px.jpg", // right
          "textures/cube/skybox/nx.jpg", // left
          "textures/cube/skybox/py.jpg", // top
          "textures/cube/skybox/ny.jpg", // bottom
          "textures/cube/skybox/pz.jpg", // back
          "textures/cube/skybox/nz.jpg", // front
        ],
        2000,
      );

      scene.add(skybox);

      scene.add(
        makePlatform(
          "models/platform/platform.json",
          "models/platform/platform.jpg",
          "models/platform/plate.jpg",
        ),
      );

      document.body.appendChild(renderer.domElement);

      const stats = new Stats();
      document.body.appendChild(stats.dom);

      window.addEventListener("resize", onWindowResize);
      onWindowResize();

      requestAnimationFrame(animate);

      if (navigator.userAgent.toLowerCase().indexOf("firefox") > -1) {
        // The scene is not rendered in Firefox, without an initial move
        setTimeout(function () {
          motion.velocity.y = 0.5;
        }, 1500);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      let lastTimeStamp;

      function animate(timeStamp) {
        requestAnimationFrame(animate);

        const dt = lastTimeStamp ? timeStamp - lastTimeStamp : 0;
        lastTimeStamp = timeStamp;

        resetPlayer();
        keyboardControls();
        turn(look.x * 0.0015 * dt, look.y * 0.0015 * dt);
        jumpPads();
        applyPhysics(dt);
        updateCamera();

        renderer.render(scene, camera);
        stats.update();
      }
    </script>
  </body>
</html>
