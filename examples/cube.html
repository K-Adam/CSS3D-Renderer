<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Spinning box</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }

      #info {
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        color: #fff;
        font: 13px monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="info">
      A spinning box built from CSS 3D transforms, hover to fade
    </div>
    <script type="module">
      import {
        Container,
        Filter,
        Group,
        Material,
        Transform,
        Tween,
      } from "c3r";
      import { mat4 } from "gl-matrix";
      import { cube } from "primitive-geometry";

      const container = new Container();
      document.body.appendChild(container.domElement);

      const box = new Group();
      container.root.addChild(box);
      box.addMesh(cube({ sx: 200 }));

      box.material = new Material();
      box.material.backgroundImageSrc = "textures/crate.jpg";

      container.camera.matrix = mat4.fromTranslation(
        mat4.create(),
        [0, 0, 400],
      );

      const turn = 2 * Math.PI;
      const spin = new Tween({
        keyframes: [
          [
            Transform.rotateX(turn),
            Transform.rotateY(turn),
            Transform.rotateZ(turn),
          ],
        ],
        duration: turn, // one radian per second
        loop: true,
      });
      const fade = new Tween({
        keyframes: [Filter.opacity(0.5)],
        duration: 0.5,
        hover: true,
      });
      box.tween = [spin, fade];

      container.bake();
    </script>
  </body>
</html>
