<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Spinning box</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { Container, Group, Material } from "c3r";
      import { mat4, vec3 } from "gl-matrix";

      const container = new Container();
      document.body.appendChild(container.domElement);

      // The +z face of the cube, counter-clockwise
      const face = [
        { position: [-100, 100, 100], uv: [0, 1] },
        { position: [-100, -100, 100], uv: [0, 0] },
        { position: [100, -100, 100], uv: [1, 0] },
        { position: [100, 100, 100], uv: [1, 1] },
      ];

      const turn = Math.PI / 2;
      const rotations = [
        ...[0, 1, 2, 3].map((i) => mat4.fromYRotation(mat4.create(), i * turn)),
        mat4.fromXRotation(mat4.create(), turn),
        mat4.fromXRotation(mat4.create(), -turn),
      ];

      const cube = new Group();
      container.root.addChild(cube);

      for (const rotation of rotations) {
        cube.addPolygon(
          face.map(({ position, uv }) => ({
            position: vec3.transformMat4(vec3.create(), position, rotation),
            uv,
          })),
        );
      }

      cube.material = new Material();
      cube.material.backgroundImageSrc = "textures/crate.jpg";

      // The camera matrix is the inverse world transform
      container.camera.matrix = mat4.fromTranslation(
        mat4.create(),
        [0, 0, -400],
      );

      function animate() {
        cube.matrix = mat4.fromRotation(
          mat4.create(),
          Date.now() / 1000,
          [1, 1, 1],
        );
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
