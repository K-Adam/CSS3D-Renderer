<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Spinning box</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { Container, Group, Material } from "c3r";
      import { mat4 } from "gl-matrix";
      import { cube } from "primitive-geometry";

      const container = new Container();
      document.body.appendChild(container.domElement);

      const box = new Group();
      container.root.addChild(box);
      box.addMesh(cube({ sx: 200 }));

      box.material = new Material();
      box.material.backgroundImageSrc = "textures/crate.jpg";

      // The camera matrix is the inverse world transform
      container.camera.matrix = mat4.fromTranslation(
        mat4.create(),
        [0, 0, -400],
      );

      function animate() {
        box.matrix = mat4.fromRotation(
          mat4.create(),
          Date.now() / 1000,
          [1, 1, 1],
        );
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
