<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Interactive cubes</title>
    <style>
      body {
        margin: 0;
        background-color: #f0f0f0;
        overflow: hidden;
        touch-action: none;
      }

      #info {
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        font: 13px monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
      - interactive cubes. Click a cube to move it.
    </div>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";
      import * as TWEEN from "three/addons/libs/tween.module.js";
      import Stats from "three/addons/libs/stats.module.js";

      let camera, scene, renderer, stats;

      let raycaster;
      let pointer;

      const radius = 600;
      let theta = 0;

      init();
      animate();

      function init() {
        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          10000,
        );
        camera.position.y = 300;
        camera.position.z = 500;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const geometry = new THREE.BoxGeometry(100, 100, 100);

        for (let i = 0; i < 16; i++) {
          const object = new THREE.Mesh(
            geometry,
            new THREE.MeshBasicMaterial({
              color: Math.random() * 0xffffff,
              opacity: 0.5,
              transparent: true,
            }),
          );
          object.position.x = Math.random() * 800 - 400;
          object.position.y = Math.random() * 800 - 400;
          object.position.z = Math.random() * 800 - 400;
          object.scale.x = Math.random() * 2 + 1;
          object.scale.y = Math.random() * 2 + 1;
          object.scale.z = Math.random() * 2 + 1;
          object.rotation.x = Math.random() * 2 * Math.PI;
          object.rotation.y = Math.random() * 2 * Math.PI;
          object.rotation.z = Math.random() * 2 * Math.PI;
          scene.add(object);
        }

        raycaster = new THREE.Raycaster();
        pointer = new THREE.Vector2();

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        stats = new Stats();
        document.body.appendChild(stats.dom);

        document.addEventListener("pointerdown", onPointerDown);

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onPointerDown(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects(scene.children);

        if (intersects.length > 0) {
          new TWEEN.Tween(intersects[0].object.position)
            .to(
              {
                x: Math.random() * 800 - 400,
                y: Math.random() * 800 - 400,
                z: Math.random() * 800 - 400,
              },
              2000,
            )
            .easing(TWEEN.Easing.Elastic.Out)
            .start();

          new TWEEN.Tween(intersects[0].object.rotation)
            .to(
              {
                x: Math.random() * 2 * Math.PI,
                y: Math.random() * 2 * Math.PI,
                z: Math.random() * 2 * Math.PI,
              },
              2000,
            )
            .easing(TWEEN.Easing.Elastic.Out)
            .start();
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        TWEEN.update();

        theta += 0.1;

        camera.position.x = radius * Math.sin(THREE.MathUtils.degToRad(theta));
        camera.position.y = radius * Math.sin(THREE.MathUtils.degToRad(theta));
        camera.position.z = radius * Math.cos(THREE.MathUtils.degToRad(theta));
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
        stats.update();
      }
    </script>
  </body>
</html>
