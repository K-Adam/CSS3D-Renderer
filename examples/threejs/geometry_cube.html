<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Cube geometry</title>
    <style>
      body {
        margin: 0;
        background-color: #f0f0f0;
        overflow: hidden;
        touch-action: none;
      }

      #info {
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        font: 13px monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
      - cube geometry. Drag to spin the cube.
    </div>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";
      import Stats from "three/addons/libs/stats.module.js";

      let camera, scene, renderer, stats;

      let cube, plane;

      let targetRotation = 0;
      let targetRotationOnPointerDown = 0;

      let pointerX = 0;
      let pointerXOnPointerDown = 0;

      let windowHalfX = window.innerWidth / 2;

      init();
      animate();

      function init() {
        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          1000,
        );
        camera.position.y = 150;
        camera.position.z = 500;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        // Cube

        const cubeGeometry = new THREE.BoxGeometry(200, 200, 200);

        const cubeMaterials = [];
        for (let i = 0; i < 6; i++) {
          const hex = Math.random() * 0xffffff;
          cubeMaterials.push(new THREE.MeshBasicMaterial({ color: hex }));
        }

        cube = new THREE.Mesh(cubeGeometry, cubeMaterials);
        cube.position.y = 150;
        scene.add(cube);

        // Plane

        const planeGeometry = new THREE.PlaneGeometry(200, 200);
        planeGeometry.rotateX(-Math.PI / 2);

        const planeMaterial = new THREE.MeshBasicMaterial({ color: 0xe0e0e0 });

        plane = new THREE.Mesh(planeGeometry, planeMaterial);
        scene.add(plane);

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        stats = new Stats();
        document.body.appendChild(stats.dom);

        document.addEventListener("pointerdown", onPointerDown);

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        windowHalfX = window.innerWidth / 2;

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onPointerDown(event) {
        if (!event.isPrimary) return;
        event.preventDefault();

        pointerXOnPointerDown = event.clientX - windowHalfX;
        targetRotationOnPointerDown = targetRotation;

        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
      }

      function onPointerMove(event) {
        if (!event.isPrimary) return;

        pointerX = event.clientX - windowHalfX;
        targetRotation =
          targetRotationOnPointerDown +
          (pointerX - pointerXOnPointerDown) * 0.02;
      }

      function onPointerUp(event) {
        if (!event.isPrimary) return;

        document.removeEventListener("pointermove", onPointerMove);
        document.removeEventListener("pointerup", onPointerUp);
      }

      function animate() {
        requestAnimationFrame(animate);

        plane.rotation.y = cube.rotation.y +=
          (targetRotation - cube.rotation.y) * 0.05;

        renderer.render(scene, camera);
        stats.update();
      }
    </script>
  </body>
</html>
