<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Point light</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }

      #info {
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        color: #fff;
        font: 13px monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="info">A point light circling a plane, animated by CSS alone</div>
    <script type="module">
      import {
        Billboard,
        Container,
        Group,
        Material,
        Transform,
        Tween,
      } from "c3r";
      import { quad } from "primitive-geometry";

      const turn = 2 * Math.PI;
      const lightAt = [150, 120, 0];

      const container = new Container();
      document.body.appendChild(container.domElement);

      // One tween, so the marker stays on the light
      const orbit = new Tween({
        keyframes: [Transform.rotateY(turn)],
        duration: 8,
        loop: true,
      });
      container.lights = {
        ambient: { intensity: 0.08 },
        point: { position: lightAt, intensity: 20000, tween: orbit },
      };

      const plane = new Group();
      container.root.addChild(plane);
      plane.transform = Transform.rotateX(-Math.PI / 2);
      plane.addMesh(quad({ scale: 600 }));
      plane.material = new Material();
      plane.material.background = "textures/metal062c.jpg";
      plane.material.shading = "smooth";
      plane.material.specular = {
        intensity: 1,
        shininess: 32,
        map: "textures/metal062c_specular.png",
      };

      const carrier = new Group();
      container.root.addChild(carrier);
      carrier.tween = orbit;
      const marker = new Billboard();
      carrier.addChild(marker);
      marker.transform = Transform.translate(lightAt);
      marker.addMesh(quad({ scale: 48 }));
      marker.material = new Material();
      marker.material.background = "textures/lensflare/lensflare0_alpha.png";

      container.camera.tween = new Tween({
        from: [
          Transform.rotateY(0),
          Transform.rotateX(-Math.PI / 4),
          Transform.translate([0, 0, 800]),
        ],
        keyframes: [Transform.rotateY(turn)],
        duration: 60,
        loop: true,
      });

      container.bake();
    </script>
  </body>
</html>
