<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Cube geometry</title>
    <style>
      body {
        font-family: Monospace;
        background-color: #f0f0f0;
        margin: 0px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";
      import Stats from "three/addons/libs/stats.module.js";

      let container, stats;

      let camera, scene, renderer;

      let cube, plane;

      let targetRotation = 0;
      let targetRotationOnMouseDown = 0;

      let mouseX = 0;
      let mouseXOnMouseDown = 0;

      let windowHalfX = window.innerWidth / 2;
      let windowHalfY = window.innerHeight / 2;

      init();
      animate();

      function init() {
        container = document.createElement("div");
        document.body.appendChild(container);

        const info = document.createElement("div");
        info.style.position = "absolute";
        info.style.top = "10px";
        info.style.width = "100%";
        info.style.textAlign = "center";
        info.innerHTML = "Drag to spin the cube";
        container.appendChild(info);

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          1000,
        );
        camera.position.y = 150;
        camera.position.z = 500;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        // Cube

        const cubeGeometry = new THREE.BoxGeometry(200, 200, 200);

        const cubeMaterials = [];
        for (let i = 0; i < 6; i++) {
          const hex = Math.random() * 0xffffff;
          cubeMaterials.push(new THREE.MeshBasicMaterial({ color: hex }));
        }

        cube = new THREE.Mesh(cubeGeometry, cubeMaterials);
        cube.position.y = 150;
        scene.add(cube);

        // Plane

        const planeGeometry = new THREE.PlaneGeometry(200, 200);
        planeGeometry.rotateX(-Math.PI / 2);

        const planeMaterial = new THREE.MeshBasicMaterial({ color: 0xe0e0e0 });

        plane = new THREE.Mesh(planeGeometry, planeMaterial);
        scene.add(plane);

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        stats = new Stats();
        container.appendChild(stats.dom);

        document.addEventListener("mousedown", onDocumentMouseDown);
        document.addEventListener("touchstart", onDocumentTouchStart);
        document.addEventListener("touchmove", onDocumentTouchMove);

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        windowHalfX = window.innerWidth / 2;
        windowHalfY = window.innerHeight / 2;

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onDocumentMouseDown(event) {
        event.preventDefault();

        document.addEventListener("mousemove", onDocumentMouseMove);
        document.addEventListener("mouseup", onDocumentMouseUp);
        document.addEventListener("mouseout", onDocumentMouseOut);

        mouseXOnMouseDown = event.clientX - windowHalfX;
        targetRotationOnMouseDown = targetRotation;
      }

      function onDocumentMouseMove(event) {
        mouseX = event.clientX - windowHalfX;

        targetRotation =
          targetRotationOnMouseDown + (mouseX - mouseXOnMouseDown) * 0.02;
      }

      function onDocumentMouseUp() {
        document.removeEventListener("mousemove", onDocumentMouseMove);
        document.removeEventListener("mouseup", onDocumentMouseUp);
        document.removeEventListener("mouseout", onDocumentMouseOut);
      }

      function onDocumentMouseOut() {
        document.removeEventListener("mousemove", onDocumentMouseMove);
        document.removeEventListener("mouseup", onDocumentMouseUp);
        document.removeEventListener("mouseout", onDocumentMouseOut);
      }

      function onDocumentTouchStart(event) {
        if (event.touches.length === 1) {
          event.preventDefault();

          mouseXOnMouseDown = event.touches[0].pageX - windowHalfX;
          targetRotationOnMouseDown = targetRotation;
        }
      }

      function onDocumentTouchMove(event) {
        if (event.touches.length === 1) {
          event.preventDefault();

          mouseX = event.touches[0].pageX - windowHalfX;
          targetRotation =
            targetRotationOnMouseDown + (mouseX - mouseXOnMouseDown) * 0.05;
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        stats.begin();
        render();
        stats.end();
      }

      function render() {
        plane.rotation.y = cube.rotation.y +=
          (targetRotation - cube.rotation.y) * 0.05;
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
