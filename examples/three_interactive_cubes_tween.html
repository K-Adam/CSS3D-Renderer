<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Interactive cubes</title>
    <style>
      body {
        font-family: Monospace;
        background-color: #f0f0f0;
        margin: 0px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";
      import Stats from "three/addons/libs/stats.module.js";
      import * as TWEEN from "three/addons/libs/tween.module.js";

      let container, stats;
      let camera, scene, renderer;

      let raycaster;
      let mouse;

      const radius = 600;
      let theta = 0;

      init();
      animate();

      function init() {
        container = document.createElement("div");
        document.body.appendChild(container);

        const info = document.createElement("div");
        info.style.position = "absolute";
        info.style.top = "10px";
        info.style.width = "100%";
        info.style.textAlign = "center";
        info.innerHTML =
          '<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - clickable objects';
        container.appendChild(info);

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          10000,
        );
        camera.position.y = 300;
        camera.position.z = 500;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const geometry = new THREE.BoxGeometry(100, 100, 100);

        for (let i = 0; i < 16; i++) {
          const object = new THREE.Mesh(
            geometry,
            new THREE.MeshBasicMaterial({
              color: Math.random() * 0xffffff,
              opacity: 0.5,
              transparent: true,
            }),
          );
          object.position.x = Math.random() * 800 - 400;
          object.position.y = Math.random() * 800 - 400;
          object.position.z = Math.random() * 800 - 400;
          object.scale.x = Math.random() * 2 + 1;
          object.scale.y = Math.random() * 2 + 1;
          object.scale.z = Math.random() * 2 + 1;
          object.rotation.x = Math.random() * 2 * Math.PI;
          object.rotation.y = Math.random() * 2 * Math.PI;
          object.rotation.z = Math.random() * 2 * Math.PI;
          scene.add(object);
        }

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        stats = new Stats();
        container.appendChild(stats.dom);

        document.addEventListener("mousedown", onDocumentMouseDown);
        document.addEventListener("touchstart", onDocumentTouchStart);

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onDocumentTouchStart(event) {
        event.preventDefault();

        event.clientX = event.touches[0].clientX;
        event.clientY = event.touches[0].clientY;
        onDocumentMouseDown(event);
      }

      function onDocumentMouseDown(event) {
        event.preventDefault();

        mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
        mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(scene.children);

        if (intersects.length > 0) {
          new TWEEN.Tween(intersects[0].object.position)
            .to(
              {
                x: Math.random() * 800 - 400,
                y: Math.random() * 800 - 400,
                z: Math.random() * 800 - 400,
              },
              2000,
            )
            .easing(TWEEN.Easing.Elastic.Out)
            .start();

          new TWEEN.Tween(intersects[0].object.rotation)
            .to(
              {
                x: Math.random() * 2 * Math.PI,
                y: Math.random() * 2 * Math.PI,
                z: Math.random() * 2 * Math.PI,
              },
              2000,
            )
            .easing(TWEEN.Easing.Elastic.Out)
            .start();
        }

        /*
				// Parse all the faces
				for ( var i in intersects ) {

					intersects[ i ].face.material[ 0 ].color.setHex( Math.random() * 0xffffff | 0x80000000 );

				}
				*/
      }

      function animate() {
        requestAnimationFrame(animate);

        render();
        stats.update();
      }

      function render() {
        TWEEN.update();

        theta += 0.1;

        camera.position.x = radius * Math.sin(THREE.MathUtils.degToRad(theta));
        camera.position.y = radius * Math.sin(THREE.MathUtils.degToRad(theta));
        camera.position.z = radius * Math.cos(THREE.MathUtils.degToRad(theta));
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
