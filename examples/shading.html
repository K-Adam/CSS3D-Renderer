<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Flat shading</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }

      #info {
        position: absolute;
        z-index: 1;
        top: 0;
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        color: #fff;
        font: 13px monospace;
        text-align: center;
      }

      #info input {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <label>
        Diffuse shading in pure CSS, light angle
        <input
          id="angle"
          type="range"
          min="0"
          max="6.283"
          step="0.01"
          value="1"
        />
      </label>
    </div>
    <script type="module">
      import { Container, Group, Material, Transform, Tween } from "c3r";
      import { cube, icosphere } from "primitive-geometry";

      const container = new Container();
      document.body.appendChild(container.domElement);

      const input = document.querySelector("#angle");
      const light = () => {
        const angle = Number(input.value);
        container.lights = {
          ambient: { intensity: 0.15 },
          directional: {
            direction: [-Math.cos(angle), -0.7, -Math.sin(angle)],
            intensity: 1,
          },
        };
      };
      input.addEventListener("input", light);
      light();

      const turn = 2 * Math.PI;
      const tumble = new Tween({
        keyframes: [[Transform.rotateX(turn), Transform.rotateY(turn)]],
        duration: 16,
        loop: true,
      });

      const shape = (x, mesh, background) => {
        const group = new Group();
        container.root.addChild(group);
        group.transform = Transform.translate([x, 0, 0]);
        group.tween = tumble;
        group.material = new Material();
        group.material.background = background;
        group.material.shading = "flat";
        group.addMesh(mesh);
      };

      shape(-170, cube({ sx: 200 }), "textures/crate.jpg");
      shape(
        170,
        icosphere({ radius: 130, subdivisions: 1 }),
        [0.9, 0.5, 0.2, 1],
      );

      container.camera.tween = new Tween({
        from: [
          Transform.rotateY(0),
          Transform.rotateX(-0.3),
          Transform.translate([0, 0, 800]),
        ],
        keyframes: [Transform.rotateY(turn)],
        duration: 40,
        loop: true,
      });

      container.bake();
    </script>
  </body>
</html>
