<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Sprites</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        background-color: #ffffff;
        margin: 0;
        font-family: Arial;
        overflow: hidden;
      }

      a {
        color: #8888ff;
      }

      #info {
        position: absolute;
        width: 100%;
        color: #000000;
        padding: 5px;
        font-family: Monospace;
        font-size: 13px;
        font-weight: bold;
        text-align: center;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener"
        >three.js css3d</a
      >
      - sprites.
    </div>
    <div id="container"></div>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer, CSS3DSprite } from "c3r-three";
      import { TrackballControls } from "three/addons/controls/TrackballControls.js";
      import * as TWEEN from "three/addons/libs/tween.module.js";

      let camera, scene, renderer;
      let controls;

      const particlesTotal = 512;
      const positions = [];
      const objects = [];
      let current = 0;

      init();
      animate();

      function init() {
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          1,
          5000,
        );
        camera.position.set(600, 400, 1500);
        camera.lookAt(new THREE.Vector3());

        scene = new THREE.Scene();

        const image = document.createElement("img");
        image.addEventListener("load", function () {
          for (let i = 0; i < particlesTotal; i++) {
            const object = new CSS3DSprite(image.cloneNode());
            object.position.x = Math.random() * 4000 - 2000;
            object.position.y = Math.random() * 4000 - 2000;
            object.position.z = Math.random() * 4000 - 2000;
            scene.add(object);

            objects.push(object);
          }

          transition();
        });
        image.src = "textures/sprite.png";

        // Plane

        const amountX = 16;
        const amountZ = 32;
        const separation = 150;
        const offsetX = ((amountX - 1) * separation) / 2;
        const offsetZ = ((amountZ - 1) * separation) / 2;

        for (let i = 0; i < particlesTotal; i++) {
          const x = (i % amountX) * separation;
          const z = Math.floor(i / amountX) * separation;
          const y = (Math.sin(x * 0.5) + Math.sin(z * 0.5)) * 200;

          positions.push(x - offsetX, y, z - offsetZ);
        }

        // Cube

        const amount = 8;
        const cubeSeparation = 150;
        const offset = ((amount - 1) * cubeSeparation) / 2;

        for (let i = 0; i < particlesTotal; i++) {
          const x = (i % amount) * cubeSeparation;
          const y = Math.floor((i / amount) % amount) * cubeSeparation;
          const z = Math.floor(i / (amount * amount)) * cubeSeparation;

          positions.push(x - offset, y - offset, z - offset);
        }

        // Random

        for (let i = 0; i < particlesTotal; i++) {
          positions.push(
            Math.random() * 4000 - 2000,
            Math.random() * 4000 - 2000,
            Math.random() * 4000 - 2000,
          );
        }

        // Sphere

        const radius = 750;

        for (let i = 0; i < particlesTotal; i++) {
          const phi = Math.acos(-1 + (2 * i) / particlesTotal);
          const theta = Math.sqrt(particlesTotal * Math.PI) * phi;

          positions.push(
            radius * Math.cos(theta) * Math.sin(phi),
            radius * Math.sin(theta) * Math.sin(phi),
            radius * Math.cos(phi),
          );
        }

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("container").appendChild(renderer.domElement);

        controls = new TrackballControls(camera, renderer.domElement);
        controls.rotateSpeed = 0.5;

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function transition() {
        const offset = current * particlesTotal * 3;
        const duration = 2000;

        for (let i = 0, j = offset; i < particlesTotal; i++, j += 3) {
          const object = objects[i];

          new TWEEN.Tween(object.position)
            .to(
              {
                x: positions[j],
                y: positions[j + 1],
                z: positions[j + 2],
              },
              Math.random() * duration + duration,
            )
            .easing(TWEEN.Easing.Exponential.InOut)
            .start();
        }

        new TWEEN.Tween({})
          .to({}, duration * 3)
          .onComplete(transition)
          .start();

        current = (current + 1) % 4;
      }

      function animate() {
        requestAnimationFrame(animate);

        TWEEN.update();
        controls.update();

        const time = performance.now();

        for (let i = 0, l = objects.length; i < l; i++) {
          const object = objects[i];
          const scale =
            Math.sin((Math.floor(object.position.x) + time) * 0.002) * 0.3 + 1;
          object.scale.set(scale, scale, scale);
        }

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
