<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Earth</title>
    <style>
      body {
        color: #808080;
        font-family: Monospace;
        font-size: 13px;
        text-align: center;

        background-color: #ffffff;
        margin: 0px;
        overflow: hidden;
        touch-action: none;
      }

      #info {
        position: absolute;
        top: 0px;
        width: 100%;
        padding: 5px;
      }

      a {
        color: #0080ff;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="info">
      <a href="http://threejs.org" target="_blank" rel="noopener">three.js</a> -
      earth demo
    </div>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";
      import Stats from "three/addons/libs/stats.module.js";

      let container, stats;
      let camera, scene, renderer;
      let group;
      let mouseX = 0,
        mouseY = 0;

      let windowHalfX = window.innerWidth / 2;
      let windowHalfY = window.innerHeight / 2;

      init();
      animate();

      function init() {
        container = document.getElementById("container");

        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          1,
          2000,
        );
        camera.position.z = 500;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        group = new THREE.Group();
        scene.add(group);

        // earth

        const loader = new THREE.TextureLoader();
        loader.load(
          "textures/land_ocean_ice_cloud_2048.jpg",
          function (texture) {
            const geometry = new THREE.SphereGeometry(200, 16, 10);

            const material = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);
          },
        );

        // shadow

        const canvas = document.createElement("canvas");
        canvas.width = 128;
        canvas.height = 128;

        const context = canvas.getContext("2d");
        const gradient = context.createRadialGradient(
          canvas.width / 2,
          canvas.height / 2,
          0,
          canvas.width / 2,
          canvas.height / 2,
          canvas.width / 2,
        );
        gradient.addColorStop(0.1, "rgba(210,210,210,1)");
        gradient.addColorStop(1, "rgba(255,255,255,1)");

        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);

        const texture = new THREE.CanvasTexture(canvas);

        const geometry = new THREE.PlaneGeometry(300, 300, 2, 2);
        const material = new THREE.MeshBasicMaterial({ map: texture });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.y = -250;
        mesh.rotation.x = -Math.PI / 2;
        group.add(mesh);

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        stats = new Stats();
        container.appendChild(stats.dom);

        document.addEventListener("pointermove", onDocumentMouseMove);

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        windowHalfX = window.innerWidth / 2;
        windowHalfY = window.innerHeight / 2;

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onDocumentMouseMove(event) {
        mouseX = event.clientX - windowHalfX;
        mouseY = event.clientY - windowHalfY;
      }

      function animate() {
        if (!window.no_animate) {
          requestAnimationFrame(animate);
        }

        render();
        stats.update();
      }

      function render() {
        camera.position.x += (mouseX - camera.position.x) * 0.05;
        camera.position.y += (-mouseY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        group.rotation.y -= 0.005;

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
