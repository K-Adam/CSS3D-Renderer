<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>c3r - Canvas material</title>
    <style>
      body {
        margin: 0px;
        background-color: #050505;
        color: #fff;
        overflow: hidden;
      }

      a {
        color: #e00;
      }

      #info {
        position: absolute;
        top: 0px;
        width: 100%;
        color: #ffffff;
        padding: 5px;
        font-family: Monospace;
        font-size: 13px;
        text-align: center;
        z-index: 1000;
      }

      #drawing-canvas {
        position: absolute;
        background-color: #000000;
        top: 0px;
        right: 0px;
        z-index: 3000;
        cursor: crosshair;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
      - webgl - canvas as a texture
      <div>click and draw in the white box</div>
    </div>
    <canvas id="drawing-canvas" height="128" width="128"></canvas>

    <script type="module">
      import * as THREE from "three";
      import { C3RRenderer } from "c3r-three";

      let camera, scene, renderer, mesh, material;
      let drawX, drawY;

      init();
      setupCanvasDrawing();
      animate();

      function init() {
        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          1,
          2000,
        );
        camera.position.z = 500;

        scene = new THREE.Scene();

        material = new THREE.MeshBasicMaterial();

        mesh = new THREE.Mesh(new THREE.BoxGeometry(200, 200, 200), material);
        scene.add(mesh);

        renderer = new C3RRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener("resize", onWindowResize);
      }

      function setupCanvasDrawing() {
        const drawingCanvas = document.getElementById("drawing-canvas");
        const drawingContext = drawingCanvas.getContext("2d");

        drawingContext.fillStyle = "#FFFFFF";
        drawingContext.fillRect(0, 0, 128, 128);
        drawingContext.strokeStyle = "#000000";

        material.map = new THREE.CanvasTexture(drawingCanvas);

        drawingCanvas.addEventListener("pointerdown", function (e) {
          if (!e.isPrimary) return;
          drawingCanvas.setPointerCapture(e.pointerId);
          drawX = e.offsetX;
          drawY = e.offsetY;
        });

        drawingCanvas.addEventListener("pointermove", function (e) {
          if (drawingCanvas.hasPointerCapture(e.pointerId)) {
            draw(drawingContext, e.offsetX, e.offsetY);
          }
        });
      }

      function draw(drawContext, x, y) {
        drawContext.beginPath();
        drawContext.moveTo(drawX, drawY);
        drawContext.lineTo(x, y);
        drawContext.stroke();
        drawX = x;
        drawY = y;
        material.map.needsUpdate = true;
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        mesh.rotation.x += 0.01;
        mesh.rotation.y += 0.01;

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
